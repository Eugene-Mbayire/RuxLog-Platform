<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuxLog - Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Display font for the generated schedule card only (see .schedule-card) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-content">
    <div class="dashboard-header">
      <img id="profile-photo" class="profile-photo" alt="" hidden />
      <div>
        <h2 id="welcome-text">Loading...</h2>
        <p id="today-date" class="text-muted"></p>
      </div>
    </div>

    <div id="cards-container" class="card-grid"></div>

    <h4 class="section-title dashboard-schedule-title">Today's Schedule</h4>
    <div id="dashboard-schedule-container"></div>
  </div>

  <!-- Supabase client library and html2canvas (for sharing the schedule), both from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/schedule-preview.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
